<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f18"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="492" height="492" x="10" y="10" rx="102" fill="none" stroke="url(#border)" stroke-width="16"/>
  
  <g font-family="'Oswald', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="700">
    <circle cx="92" cy="270" r="28" fill="#00f5ff" filter="url(#glow)"/>
    <circle cx="92" cy="270" r="22" fill="#38bdf8"/>
    <circle cx="92" cy="270" r="14" fill="#ffffff"/>
    <text x="132" y="306" font-size="136" fill="#ffffff" letter-spacing="4">MOIA</text>
  </g>
</svg>
